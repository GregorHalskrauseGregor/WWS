# Artikelklassen: welche Angaben eine Artikelart braucht
#
# identitaet: Merkmale, die zwei Zeilen unterscheiden. Sind sie alle gleich,
#             ist es derselbe Artikel (und damit dieselbe Position, ggf. mit
#             mehreren Chargen).
# pflicht:    ohne diese Angaben ist eine Einlagerung nicht sinnvoll — der Bot
#             fragt gezielt nach, statt eine halbe Position anzulegen.
# optional:   wird übernommen, wenn genannt; erzeugt aber keine Rückfrage.
# regeln:     Schlussfolgerungen, die der Code zieht, bevor er nachfragt.
# frage:      der Wortlaut der Rückfrage je Merkmal.
#
# Pflegehinweis: eine neue Artikelart ist ein neuer Abschnitt. "erkennen_an"
# sagt dem Bot, wann die Klasse gemeint ist.

rohr:
  erkennen_an: [rohr, rohre, stange, leitung]
  identitaet: [material, dimension, wandstaerke]
  pflicht:    [material, dimension, laenge]
  optional:   [marke, artnr, zulassung, wandstaerke]
  einheit:    m
  frage:
    material:  "Aus welchem Material — Kupfer, Stahl (schwarz), verzinkt, Edelstahl oder Verbundrohr?"
    dimension: "Welche Dimension? (z. B. 22 mm, DN25, 1/2 Zoll)"
    laenge:    "Wie lang — einzelne Meter oder ganze Stangen?"

bogen:
  erkennen_an: [bogen, boegen, bögen, winkel, knie]
  identitaet: [material, dimension, winkel, verbindung, kontur, enden]
  pflicht:    [material, dimension, verbindung]
  optional:   [winkel, kontur, enden, marke, artnr, zulassung]
  einheit:    "Stk."
  regeln:
    # Ohne Angabe ist ein Bogen 90 Grad — alles andere wird ausdrücklich gesagt.
    - wenn: "winkel fehlt"
      dann: "winkel = 90"
    # Pressfittinge brauchen zwingend die Kontur, sonst passt die Backe nicht.
    - wenn: "verbindung = pressen und kontur fehlt"
      dann: "nachfragen kontur"
  frage:
    material:   "Aus welchem Material?"
    dimension:  "Welche Dimension?"
    verbindung: "Wie wird verbunden — gepresst, gelötet, geschweißt oder Gewinde?"
    kontur:     "Welche Presskontur — V, M, TH oder U?"
    enden:      "Beide Seiten Muffe, oder eine Seite Spitzende?"

t_stueck:
  erkennen_an: [t-stueck, tstueck, t stück, t-stück, abzweig]
  identitaet: [material, dn1, dn2, dn3, verbindung, kontur]
  pflicht:    [material, dn1, verbindung]
  optional:   [dn2, dn3, kontur, marke, artnr, zulassung]
  einheit:    "Stk."
  regeln:
    # Wird nur eine Dimension genannt, ist das T-Stück durchgehend gleich groß.
    # Ein reduziertes T-Stück wird immer ausdrücklich als solches genannt.
    - wenn: "dn2 fehlt und dn3 fehlt"
      dann: "dn2 = dn1, dn3 = dn1"
    - wenn: "dn3 fehlt"
      dann: "dn3 = dn1"
  frage:
    material:   "Aus welchem Material?"
    dn1:        "Welche Dimension hat der Durchgang?"
    dn2:        "Und der Abgang — gleiche Dimension oder reduziert?"
    verbindung: "Wie wird verbunden — gepresst, gelötet, geschweißt oder Gewinde?"

muffe:
  erkennen_an: [muffe, muffen, verbinder, kupplung]
  identitaet: [material, dimension, verbindung, kontur]
  pflicht:    [material, dimension, verbindung]
  optional:   [kontur, marke, artnr, zulassung]
  einheit:    "Stk."

reduktion:
  erkennen_an: [reduktion, reduzierung, reduzierstueck, reduzierstück]
  identitaet: [material, dn1, dn2, verbindung, kontur]
  pflicht:    [material, dn1, dn2, verbindung]
  optional:   [kontur, marke, artnr]
  einheit:    "Stk."
  frage:
    dn1: "Von welcher Dimension?"
    dn2: "Auf welche Dimension?"

kugelhahn:
  erkennen_an: [kugelhahn, kugelhaehne, kugelhähne, absperrhahn, kfe]
  identitaet: [dimension, zulassung, anschluss, marke, artnr]
  pflicht:    [dimension, zulassung]
  optional:   [anschluss, griff, marke, artnr]
  einheit:    "Stk."
  regeln:
    # Ohne Angabe: die niedrigste Zulassung annehmen, nicht die höchste.
    - wenn: "zulassung fehlt"
      dann: "nachfragen zulassung"
  frage:
    dimension: "Welche Dimension? (z. B. 1/2 Zoll oder DN15)"
    zulassung: "Für welchen Bereich — Heizung, Trinkwasser oder Gas?"
    anschluss: "Beidseitig Innengewinde, oder Außen-/Innengewinde?"

pumpe:
  erkennen_an: [pumpe, umwaelzpumpe, umwälzpumpe, heizungspumpe]
  identitaet: [marke, typ, baulaenge, anschluss]
  pflicht:    [marke, typ]
  optional:   [baulaenge, anschluss, artnr]
  einheit:    "Stk."
  frage:
    marke: "Von welchem Hersteller?"
    typ:   "Welcher Typ genau? (z. B. Magna3 25-60)"

befestigung:
  erkennen_an: [schelle, rohrschelle, duebel, dübel, stockschraube, schraube, mutter]
  identitaet: [art, dimension, gewinde]
  pflicht:    [art, dimension]
  optional:   [material, marke]
  einheit:    "Stk."

# Auffangklasse: alles, was keiner Artikelart zugeordnet werden kann.
# Bewusst genügsam — lieber erfassen als blockieren. Der Bot schlägt vor,
# eine passende Klasse anzulegen, wenn dieselbe Art öfter hier landet.
sonstiges:
  erkennen_an: []
  identitaet: [bezeichnung]
  pflicht:    [bezeichnung]
  optional:   [marke, artnr, dimension, material]
  einheit:    "Stk."

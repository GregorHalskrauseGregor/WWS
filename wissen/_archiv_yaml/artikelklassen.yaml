# Artikelklassen
#
# warengruppe:      Pfad im Baum aus warengruppen.yaml (punktgetrennt).
#                   Beantwortet "alle Absperrarmaturen", "alle Fittinge".
# einsatzbereiche:  In welchen Gewerken die Art vorkommen KANN. Wofür ein
#                   konkretes Stück zugelassen ist, sagt sein Merkmal
#                   "zulassung" — deshalb steht das Gewerk nicht im Baum.
# identitaet:       Merkmale, die zwei Zeilen unterscheiden. Alle gleich =
#                   derselbe Artikel.
# pflicht:          zusätzlich zu den globalen Pflichtmerkmalen aus
#                   merkmale.yaml (menge, dimension, material). Nur hier
#                   eintragen, was DIESE Art darüber hinaus braucht.
# erwartet:         wird einmal gefragt, darf übersprungen werden.
# regeln:           was der Code schließt, bevor er fragt.

rohr:
  erkennen_an: [rohr, rohre, stange, leitung]
  warengruppe: rohre_leitungen.metallrohr
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [material, dimension, wandstaerke]
  pflicht:    [laenge]
  erwartet:   [wandstaerke]
  optional:   [marke, artnr, zulassung]
  einheit:    m
  frage:
    laenge:      "Wie lang — einzelne Meter oder ganze Stangen?"
    wandstaerke: "Welche Wandstärke? (überspringen, wenn unbekannt)"

bogen:
  erkennen_an: [bogen, boegen, bögen, winkel, knie]
  warengruppe: fittinge.formstuecke
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [material, dimension, winkel, verbindung, kontur, enden]
  pflicht:    [verbindung]
  erwartet:   [winkel, enden]
  optional:   [kontur, marke, artnr, zulassung]
  einheit:    "Stk."
  regeln:
    - wenn: "winkel fehlt"
      dann: "winkel = 90"
    - wenn: "verbindung = pressen und kontur fehlt"
      dann: "nachfragen kontur"
  frage:
    verbindung: "Wie wird verbunden — gepresst, gelötet, geschweißt oder Gewinde?"
    kontur:     "Welche Presskontur — V, M, TH oder U?"
    enden:      "Beide Seiten Muffe, oder eine Seite Spitzende?"

t_stueck:
  erkennen_an: [t-stueck, tstueck, t stück, t-stück, abzweig]
  warengruppe: fittinge.formstuecke
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [material, dn1, dn2, dn3, verbindung, kontur]
  pflicht:    [dn1, verbindung]
  erwartet:   [dn2, dn3]
  optional:   [kontur, marke, artnr, zulassung]
  einheit:    "Stk."
  # dimension heißt hier dn1 — sonst würde global nach "dimension" gefragt.
  dimension_heisst: dn1
  regeln:
    - wenn: "dn2 fehlt und dn3 fehlt"
      dann: "dn2 = dn1, dn3 = dn1"
    - wenn: "dn3 fehlt"
      dann: "dn3 = dn1"
  frage:
    dn1:        "Welche Dimension hat der Durchgang?"
    dn2:        "Und der Abgang — gleiche Dimension oder reduziert?"
    verbindung: "Wie wird verbunden — gepresst, gelötet, geschweißt oder Gewinde?"

muffe:
  erkennen_an: [muffe, muffen, verbinder, kupplung]
  warengruppe: fittinge.verbinder
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [material, dimension, verbindung, kontur]
  pflicht:    [verbindung]
  erwartet:   [kontur]
  optional:   [marke, artnr, zulassung]
  einheit:    "Stk."
  frage:
    verbindung: "Wie wird verbunden — gepresst, gelötet, geschweißt oder Gewinde?"

reduktion:
  erkennen_an: [reduktion, reduzierung, reduzierstueck, reduzierstück]
  warengruppe: fittinge.uebergaenge
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [material, dn1, dn2, verbindung, kontur]
  pflicht:    [dn1, dn2, verbindung]
  erwartet:   [kontur]
  optional:   [marke, artnr]
  einheit:    "Stk."
  dimension_heisst: dn1
  frage:
    dn1: "Von welcher Dimension?"
    dn2: "Auf welche Dimension?"
    verbindung: "Wie wird verbunden?"

kugelhahn:
  erkennen_an: [kugelhahn, kugelhaehne, kugelhähne, absperrhahn, kfe]
  warengruppe: armaturen.absperr
  einsatzbereiche: [heizung, trinkwasser, gas]
  identitaet: [dimension, zulassung, anschluss, marke, artnr]
  pflicht:    []
  erwartet:   [anschluss]
  optional:   [griff, marke, artnr]
  einheit:    "Stk."
  # material ist beim Kugelhahn selten der Unterschied — die Zulassung ist es.
  material_optional: true
  frage:
    anschluss: "Beidseitig Innengewinde, oder Außen-/Innengewinde?"

pumpe:
  erkennen_an: [pumpe, umwaelzpumpe, umwälzpumpe, heizungspumpe]
  warengruppe: pumpen.umwaelz
  einsatzbereiche: [heizung, trinkwasser]
  identitaet: [marke, typ, baulaenge, anschluss]
  # baulaenge ist die Dimension der Pumpe (siehe ersatz in merkmale.yaml)
  # und damit Pflicht — 25-60 und 25-40 sind verschiedene Artikel.
  pflicht:    [marke, typ]
  erwartet:   [anschluss]
  optional:   [artnr]
  einheit:    "Stk."
  frage:
    marke:     "Von welchem Hersteller?"
    typ:       "Welcher Typ genau? (z. B. Magna3 25-60)"
    baulaenge: "Welche Baulänge? (z. B. 180 mm)"

befestigung:
  erkennen_an: [schelle, rohrschelle, duebel, dübel, stockschraube, schraube, mutter]
  warengruppe: befestigung.schellen
  einsatzbereiche: [heizung, trinkwasser, gas, abwasser]
  identitaet: [art, dimension, gewinde]
  pflicht:    [art]
  erwartet:   [gewinde]
  optional:   [material, marke]
  einheit:    "Stk."
  frage:
    art:     "Was genau — Schelle, Dübel, Stockschraube?"
    gewinde: "Welches Gewinde? (z. B. M8)"

# Auffangklasse. Bewusst genügsam: lieber erfassen als blockieren.
# Landet dieselbe Art hier öfter, schlägt der Bot eine eigene Klasse vor.
sonstiges:
  erkennen_an: []
  warengruppe: sonstiges
  einsatzbereiche: []
  identitaet: [bezeichnung]
  pflicht:    [bezeichnung]
  erwartet:   []
  optional:   [marke, artnr, dimension, material]
  einheit:    "Stk."

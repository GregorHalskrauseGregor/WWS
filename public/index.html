<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>KI-Excel-Tool</title>
<style>
  body { font-family: sans-serif; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  #verlauf { border: 1px solid #ccc; border-radius: 6px; padding: 12px; height: 350px; overflow-y: auto; margin-bottom: 12px; background: #fafafa; }
  .nachricht { margin-bottom: 10px; }
  .nutzer { font-weight: bold; }
  .ki { color: #444; }
  form { display: flex; gap: 8px; }
  input[type=text] { flex: 1; padding: 8px; }
  button { padding: 8px 14px; cursor: pointer; }
  #download { margin-top: 16px; }
</style>
</head>
<body>
  <h1>KI-Excel-Tool</h1>
  <div id="verlauf"></div>
  <form id="chatform">
    <input type="text" id="eingabe" placeholder="z. B. Trage in B2 den Wert 450 ein" autocomplete="off">
    <button type="submit">Senden</button>
  </form>
  <div id="download">
    <a href="/api/download">Excel-Datei herunterladen</a>
  </div>

<script>
const form = document.getElementById('chatform');
const eingabe = document.getElementById('eingabe');
const verlauf = document.getElementById('verlauf');

function addMessage(text, cssClass) {
  const div = document.createElement('div');
  div.className = 'nachricht ' + cssClass;
  div.textContent = text;
  verlauf.appendChild(div);
  verlauf.scrollTop = verlauf.scrollHeight;
}

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const message = eingabe.value.trim();
  if (!message) return;

  addMessage('Du: ' + message, 'nutzer');
  eingabe.value = '';

  try {
    const res = await fetch('/api/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message })
    });
    const data = await res.json();
    if (data.error) {
      addMessage('Fehler: ' + data.error, 'ki');
    } else {
      addMessage('KI: ' + data.reply, 'ki');
    }
  } catch (err) {
    addMessage('Fehler: Server nicht erreichbar', 'ki');
  }
});
</script>
</body>
</html>
